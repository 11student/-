<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员工作台 · 知教</title>
  <link rel="stylesheet" href="/role-home.css">
  <script src="/role-home.js" defer></script>
</head>
<body data-role="admin">
  <div class="loading" id="loading" role="status">
    <span>正在核验登录信息…</span>
    <button type="button" id="retryBtn" hidden>重试</button>
  </div>
  <div class="app" id="roleApp" hidden>
    <header class="app-header">
      <div class="brand"><img src="/logo.png" alt=""><div><strong>知教</strong><span>智慧教育课程平台</span></div></div>
      <div class="header-actions"><span class="role-tag" id="roleTag"></span><button type="button" class="logout" id="logoutBtn">退出登录</button></div>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="工作台导航">
        <p class="sidebar-caption">当前入口</p>
        <p class="sidebar-role" id="sidebarRole"></p>
        <a class="nav-current" href="/admin.html" aria-current="page">工作台首页</a>
        <p class="sidebar-note">业务页面将按项目开发进度开放。</p>
      </aside>
      <main class="main">
        <div class="eyebrow" id="roleName"></div>
        <h1 id="greeting"></h1>
        <p class="intro" id="roleDescription"></p>
        <div class="summary">
          <section class="panel"><h2>当前身份</h2><dl><div><dt>登录账号</dt><dd id="accountValue"></dd></div><div><dt>服务端角色</dt><dd id="rolesValue"></dd></div></dl></section>
          <section class="panel readiness"><h2>工作台状态</h2><p>登录与权限验证已接通。教学业务页面和数据接口尚在开发中。</p></section>
        </div>
        <section class="panel menu-panel"><div class="section-head"><div><h2>已授权菜单</h2><p>名称来自后端权限；对应业务页面尚未接入。</p></div><span id="menuCount"></span></div><ul id="menuList"></ul></section>
      </main>
    </div>
  </div>
</body>
</html>
